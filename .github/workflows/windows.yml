name: Windows 验证

# 四个 job，按「跑起来需要什么」分
# -------------------------------
# · static（ubuntu）：快照一致性、探针判定逻辑、UIA 后端的逻辑 —— 都是纯文件读写 / 纯函数，
#   不需要 Windows。
# · integration（windows）：tests/test_win_integration.py —— 唯一一处「真的建窗口、真的投
#   消息」的验证，只能在 Windows 上执行。
# · smoke（windows）：tests/test_smoke.py，需要 PySide6，用 Qt 的 offscreen 平台插件。
# · build（windows）：跑用户双击的那个 build.bat，把 exe 真的打出来、真的启动一次，
#   再把产物传成 artifact。
#
# app/win/* 里带 DLL 绑定的那几个在 import 阶段就调 ctypes.WinDLL，所以带界面的那两套测试
# **只能**在 Windows 上跑。UIA 那两层特意做成了「非 Windows 也能 import」，因此它的逻辑
# 能在 ubuntu 上真跑（见 static job）。
# 仓库公开，GitHub Actions 对公开仓库不计分钟，Windows runner 双倍计费在这里不花钱。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 静态检查
  static:
    name: 静态检查（快照一致性 / 探针判定 / UIA 逻辑）
    # 这一组不需要 Windows：快照是纯文件读写，UIA 层的逻辑也刻意做成了跨平台可跑
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 探针判定逻辑（test_probe.py）
        run: python tests/test_probe.py

      - name: UIA 后端逻辑（test_uia.py）
        # 不需要 Windows，也不需要 PySide6：COM 那层对 WinDLL 做了保护，
        # 假客户端负责顶掉真实的 UIA 调用
        run: python tests/test_uia.py

      - name: 生成一份并逐字节比对
        run: |
          python bootstrap.py "$RUNNER_TEMP/generated" >/dev/null
          python - "$RUNNER_TEMP/generated" <<'PY'
          import sys
          from pathlib import Path

          generated = Path(sys.argv[1])
          repo = Path.cwd()
          ignore = {".git", "__pycache__", ".pytest_cache"}

          def collect(root):
              found = {}
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part in ignore for part in rel.parts):
                      continue
                  found[rel.as_posix()] = path
              return found

          want = collect(generated)
          have = collect(repo)
          have.pop("bootstrap.py", None)  # 生成器自己不进快照

          problems = []
          for name in sorted(set(want) | set(have)):
              if name not in have:
                  problems.append(f"快照里有、仓库里没有: {name}")
              elif name not in want:
                  problems.append(f"仓库里有、快照里没有: {name}")
              elif want[name].read_bytes() != have[name].read_bytes():
                  problems.append(f"内容不一致: {name}")

          if problems:
              print("内嵌快照与仓库不一致：")
              for line in problems:
                  print("  -", line)
              print()
              print("修法：在仓库根目录跑 `python bootstrap.py --sync`，然后提交改动。")
              sys.exit(1)

          print(f"内嵌快照与仓库逐字节一致（{len(want)} 个文件）")
          PY

  # ---------------------------------------------------------------- 真实窗口
  integration:
    name: 后台点击集成测试（真实 Win32 窗口）
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 环境信息
        run: python -c "import platform, sys; print(sys.version); print(platform.platform())"

      - name: 跑集成测试
        # 不需要 PySide6：这个文件只碰 ctypes 与 app.win / app.input 里两个纯 Win32 模块
        run: python tests/test_win_integration.py

      - name: 跑 UIA 逻辑与真 COM 自检（test_uia.py）
        # 非 Windows 上这个文件里的纯逻辑部分在 static job 已经跑过；
        # 这里多跑的是「真的 CoCreateInstance / ElementFromPoint」那几例——
        # 手写的虚表下标只有真的调一次才能证明没写错。同样不需要 PySide6。
        run: python tests/test_uia.py

  # ---------------------------------------------------------------- 冒烟
  smoke:
    name: 冒烟测试（Qt offscreen）
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑冒烟测试
        run: python tests/test_smoke.py

  # ---------------------------------------------------------------- 打包
  build:
    name: 打包 exe（PyInstaller）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # build.bat 里那套冒烟测试要用到；下面真启动 exe 时也要
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（含 PyInstaller）
        # PySide6 不只是测试要用：PyInstaller 得能 import 到它才打得进去
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 跑 build.bat
        # 故意直接跑用户双击的那个脚本，而不是在这里再抄一遍 PyInstaller 参数：
        # 那份参数表（尤其是一长串 --exclude-module）只有一处，改 build.bat 就等于
        # 改 CI，不会漂移。脚本自带测试闸门，所以这几套测试在本工作流里跑了第二遍——
        # 公开仓库不花分钟，换来的是「用户拿到的那条路径」被真的走一遍。
        # 它结尾的 pause 在 CI 里会被跳过（脚本自己认 CI=true），否则会挂到超时。
        run: .\build.bat

      - name: 确认产物
        run: |
          $exe = Get-Item dist\AutoClicker.exe
          "产物：{0}  {1:N1} MB" -f $exe.FullName, ($exe.Length / 1MB)

      - name: 真启动一次打包出来的 exe
        # 「PyInstaller 退出码是 0」只说明它把文件拼出来了，不说明这东西能跑——
        # 少一个隐藏 import 的经典表现就是「打得出、一开就退」。
        # 这里把它真的拉起来，等它写出日志文件，确认它没在启动过程中死掉。
        #
        # 预期内的噪音：runner 是无头环境（offscreen、没有 Explorer shell），
        # 所以日志里会有 app.ui.tray_icon 那句「系统托盘不可用」的 WARNING——
        # 那是托盘按设计退化成空壳（见 app/ui/tray_icon.py 的模块说明），
        # 不是打包的问题；真机上有托盘时走的是另一条分支。
        run: |
          # 先清掉可能残留的用户数据，下面才好在「有没有新日志」上做判断
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\AutoClicker" -ErrorAction SilentlyContinue

          $exeProcess = Start-Process -FilePath dist\AutoClicker.exe -PassThru
          $log = Join-Path $env:LOCALAPPDATA "AutoClicker\logs\autoclicker.log"

          # 单文件 exe 每次启动都要把几十 MB 解到临时目录，再叠加杀软扫描：
          # 给足时间（90 秒），但只要中途退出了就立刻判负
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $log) -and (Get-Date) -lt $deadline) {
              if ($exeProcess.HasExited) {
                  throw "exe 启动后立刻退出了（退出码 $($exeProcess.ExitCode)）——多半是打包漏了东西"
              }
              Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $log)) {
              throw "等了 90 秒也没等到日志文件：$log"
          }

          # 日志出现只说明「跑到了写日志那一步」；再等一会儿，确认窗口/热键/托盘
          # 那一串装配没有把它搞崩
          Start-Sleep -Seconds 5
          if ($exeProcess.HasExited) {
              throw "exe 在启动过程中崩了（退出码 $($exeProcess.ExitCode)）"
          }
          Stop-Process -Id $exeProcess.Id -Force

          $lines = Get-Content $log

          # 打全文，不打前几行：不然第 3 行之后有什么就只能靠猜
          "启动正常，日志全文（$($lines.Count) 行）："
          $lines

          # 进程还活着不代表装配没问题：出错被吞掉、降级继续跑也是一种失败方式。
          # 所以反过来把 ERROR/CRITICAL 当作硬判据。
          $errors = $lines | Where-Object { $_ -match '\[(ERROR|CRITICAL)' }
          if ($errors) {
              $errors
              throw "exe 日志里出现了 ERROR / CRITICAL（上面是原文）"
          }

          $warnings = @($lines | Where-Object { $_ -match '\[WARNING' })
          "（WARNING $($warnings.Count) 条，都在上面；无头环境的托盘那条是预期的）"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-exe
          path: dist/AutoClicker.exe
          if-no-files-found: error
          retention-days: 14
